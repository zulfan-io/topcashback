name: Android Probe Alias
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: List aliases
        run: |
          OUT=$(keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "${{ secrets.KEYSTORE_PASSWORD }}" 2>&1)
          echo "$OUT"
          echo '>>>ALIAS<<<'
          echo "$OUT" | grep -iE 'privatekeyentry'
