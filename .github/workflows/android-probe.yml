name: Android Probe Alias
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: List aliases
        run: |
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "${{ secrets.KEYSTORE_PASSWORD }}" 2>&1 | tee /tmp/kl.txt
          echo '>>>ALIAS<<<'
          grep -i 'PrivateKeyEntry' /tmp/kl.txt || echo 'NO_PRIVATE_KEY_ENTRY'
