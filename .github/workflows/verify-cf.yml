name: Verify CF
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe CF K5 wallet-stub
        run: |
          ROOT="https://topcashback.shopergo.workers.dev"
          CB="${GITHUB_RUN_ID}-$(date +%s)"
          echo "CB=$CB"

          echo "== ROOT sentinel =="
          RB=$(curl -4 -sL -o /tmp/root.html -w '%{http_code}' "$ROOT/?cb=$CB")
          echo "ROOT=$RB"
          if grep -q 'sim-match-fixture' /tmp/root.html; then
            echo "ROOT_SENTINEL=OK"
          else
            echo "ROOT_SENTINEL=MISS"
            exit 1
          fi

          echo "== /sim/wallet status =="
          W=$(curl -4 -sL -o /tmp/w.html -w '%{http_code}' "$ROOT/sim/wallet?cb=$CB")
          echo "SIM_WALLET=$W"

          if [ "$W" != "200" ]; then
            W2=$(curl -4 -sL -o /tmp/w.html -w '%{http_code}' "$ROOT/sim/wallet.html?cb=$CB")
            echo "SIM_WALLET_HTML=$W2"
            W3=$(curl -4 -sL -o /tmp/w.html -w '%{http_code}' "$ROOT/sim/wallet/index.html?cb=$CB")
            echo "SIM_WALLET_INDEX=$W3"
            if [ "$W2" != "200" ] && [ "$W3" != "200" ]; then
              echo "WALLET_ROUTE=FAIL"
              exit 1
            fi
          fi

          echo "== WALLET_MARKERS =="
          echo "WALLET_MARKERS=$(grep -oE 'Dompet Sim|Saldo Rp|Pending reward|Top-up 10K|Claim|Belanja 500' /tmp/w.html | sort -u | wc -l)"

          echo "== CLASS_SIGNATURES =="
          grep -oE 'class="[^"]*(sim-card|swipe-deck|presence-dot|swipe-ghost|social-rail|wallet-chip|stage-badge|spr-pop|pulse|wallet-shell|wallet-card|tx-list)[^"]*"' /tmp/w.html | sort | uniq -c | head -20

          echo "BODY_BYTES=$(wc -c < /tmp/w.html)"
          echo "DONE=K5_PROBE_OK"
