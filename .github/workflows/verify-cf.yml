name: Verify CF
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: L1 source-assert (gate + garus selamat)
        run: |
          A=src/App.vue
          grep -q 'const isSim = computed' "$A" || { echo "GATE_MISSING_isSim"; exit 1; }
          grep -q 'const appRoute = useRoute' "$A" || { echo "GATE_MISSING_appRoute"; exit 1; }
          grep -q 'v-if="!isSim"' "$A" || { echo "GATE_MISSING_transition_vif"; exit 1; }
          grep -q 'id="fcircle"' "$A" || { echo "TOP_MARKUP_MISSING_non-sim-intact"; exit 1; }
          grep -q "scrollFunction" "$A" && grep -q "addEventListener('scroll', scrollFunction)" "$A" || { echo "LISTENER_PAIR_BROKEN"; exit 1; }
          grep -q 'useHead' "$A" && grep -q "title: 'shoper'" "$A" || { echo "SEO_HEAD_BROKEN"; exit 1; }
          grep -q 'cashflowku' "$A" || { echo "SEO_AUTHOR_BROKEN"; exit 1; }
          grep -q 'Online shopping application' "$A" || { echo "SEO_DESC_BROKEN"; exit 1; }
          grep -q '<CToast />' "$A" || { echo "CTOAST_BROKEN"; exit 1; }
          grep -q 'router-view v-slot' "$A" && grep -q 'keep-alive' "$A" && grep -q 'suspense' "$A" || { echo "RENDER_ENGINE_BROKEN"; exit 1; }
          grep -q 'useLoading' "$A" && grep -q 'CLoading' "$A" || { echo "LOADING_BROKEN"; exit 1; }
          echo "SOURCE_GATE=OK"
      - name: L2 pulau SSR (no-regression + SEO alive + sim clean)
        run: |
          ROOT="https://topcashback.shopergo.workers.dev"
          CB="${GITHUB_RUN_ID}-$(date +%s)"
          echo "CB=$CB"
          RB=$(curl -4 -sL -o /tmp/root.html -w '%{http_code}' "$ROOT/?cb=$CB"); echo "ROOT=$RB"
          SEO_AUTHOR=$(grep -c 'cashflowku' /tmp/root.html || true); echo "SEO_AUTHOR=$SEO_AUTHOR"
          SEO_DESC=$(grep -c 'Online shopping application' /tmp/root.html || true); echo "SEO_DESC=$SEO_DESC"
          ROOT_CHROME=$(grep -c 'data-app-chrome="clean"' /tmp/root.html || true); echo "ROOT_CHROME=$ROOT_CHROME"
          ROOT_DL=$(grep -c 'Default Layout' /tmp/root.html || true); echo "ROOT_DL=$ROOT_DL"
          FAIL=0
          [ "$SEO_AUTHOR" -ge 1 ] || FAIL=1
          [ "$SEO_DESC" -ge 1 ] || FAIL=1
          [ "$ROOT_CHROME" -ge 1 ] || FAIL=1
          [ "$ROOT_DL" -eq 0 ] || FAIL=1
          for U in "/sim" "/sim/match" "/sim/stage" "/sim/wallet" "/sim/commerce" "/sim/profile"; do
            C=$(curl -4 -sL -o /tmp/r.html -w '%{http_code}' "$ROOT$U?cb=$CB")
            DL=$(grep -c 'Default Layout' /tmp/r.html || true)
            SL=$(grep -c 'data-sim-layout="clean"' /tmp/r.html || true)
            NV=$(grep -c 'data-sim-nav="1"' /tmp/r.html || true)
            echo "ROUTE=$U CODE=$C DL=$DL SL=$SL NAV=$NV"
            [ "$C" = "200" ] || FAIL=1
            [ "$DL" -eq 0 ] || FAIL=1
            [ "$SL" -ge 1 ] || FAIL=1
            [ "$NV" -ge 1 ] || FAIL=1
          done
          if [ "$FAIL" -ne 0 ]; then echo "TOP_GATE_REGRESSION=FAIL"; exit 1; fi
          echo "TOP_GATE_REGRESSION=OK"
          echo "DONE=K_TOP_PROBE_OK"
