name: Verify CF
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe CF K2
        run: |
          ROOT="https://topcashback.shopergo.workers.dev"
          SIM="$ROOT/sim"

          echo "== root headers =="
          curl -4 -sSI "$ROOT" | sed -n '1,10p' || true

          echo
          echo "== root sentinel K2 =="
          if curl -4 -sL "$ROOT" | grep -q 'sim-shell-feel'; then
            echo "ROOT_SENTINEL=OK"
          else
            echo "ROOT_SENTINEL=MISS"
            exit 1
          fi

          echo
          echo "== /sim status =="
          SIM_CODE=$(curl -4 -sL -o /dev/null -w '%{http_code}' "$SIM")
          echo "SIM=$SIM_CODE"
          if [ "$SIM_CODE" != "200" ]; then
            echo "SIM_ROUTE=FAIL"
            exit 1
          fi

          echo
          echo "== /sim body probe =="
          curl -4 -sL "$SIM" | grep -o 'sim-shell-feel' | head -1 || true

          echo
          echo "DONE=K2_PROBE_OK"
