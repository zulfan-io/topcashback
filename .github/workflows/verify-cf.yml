name: Verify CF
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe CF K7c stage-mood
        run: |
          ROOT="https://topcashback.shopergo.workers.dev"
          CB="${GITHUB_RUN_ID}-$(date +%s)"
          echo "CB=$CB"
          RB=$(curl -4 -sL -o /tmp/root.html -w '%{http_code}' "$ROOT/?cb=$CB"); echo "ROOT=$RB"
          ROOT_DL=$(grep -c 'Default Layout' /tmp/root.html || true); echo "ROOT_DEFAULT_LAYOUT=$ROOT_DL"
          if [ "$ROOT_DL" -lt 1 ]; then echo "NON_SIM_LAYOUT=BROKEN"; exit 1; fi
          S=$(curl -4 -sL -o /tmp/s.html -w '%{http_code}' "$ROOT/sim/stage?cb=$CB"); echo "SIM_STAGE=$S"
          if [ "$S" != "200" ]; then echo "STAGE_ROUTE=FAIL"; exit 1; fi
          DL=$(grep -c 'Default Layout' /tmp/s.html || true); SL=$(grep -c 'data-sim-layout="clean"' /tmp/s.html || true)
          echo "STAGE_DEFAULT_LAYOUT=$DL STAGE_SIM_LAYOUT=$SL"
          if [ "$DL" -ne 0 ] || [ "$SL" -lt 1 ]; then echo "GATE_BROKEN_ON_STAGE"; exit 1; fi
          echo "STAGE_THEME_VARS=$(grep -oE -- '--stage-bg:' /tmp/s.html | wc -l || true)"
          echo "STAGE_RAIL=$(grep -c 'stage-rail-item' /tmp/s.html || true)"
          echo "STAGE_MARKERS=$(grep -oE 'Kota Kopi|Senja Pantai|Rimba Buku' /tmp/s.html | sort -u | wc -l || true)"
          echo "STAGE_CLAIM=$(grep -c 'Klaim Reward Stage' /tmp/s.html || true)"
          echo "CHIP_stage=$(grep -c 'sim-wallet-chip' /tmp/s.html || true)"
          echo "DONE=K7C_PROBE_OK"
