name: Verify CF
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe CF K7HUB sim-light-entry
        run: |
          ROOT="https://topcashback.shopergo.workers.dev"
          CB="${GITHUB_RUN_ID}-$(date +%s)"
          echo "CB=$CB"

          RB=$(curl -4 -sL -o /tmp/root.html -w '%{http_code}' "$ROOT/?cb=$CB"); echo "ROOT=$RB"
          grep -q 'sim-match-fixture' /tmp/root.html && echo "ROOT_SENTINEL=OK" || { echo "ROOT_SENTINEL=MISS"; exit 1; }

          S=$(curl -4 -sL -o /tmp/sim.html -w '%{http_code}' "$ROOT/sim?cb=$CB"); echo "ROUTE_sim=$S"
          if [ "$S" != "200" ]; then
            S2=$(curl -4 -sL -o /tmp/sim.html -w '%{http_code}' "$ROOT/sim.html?cb=$CB"); echo "SIM_HTML=$S2"
            S3=$(curl -4 -sL -o /tmp/sim.html -w '%{http_code}' "$ROOT/sim/index.html?cb=$CB"); echo "SIM_INDEX=$S3"
            if [ "$S2" != "200" ] && [ "$S3" != "200" ]; then echo "SIM_ROUTE=FAIL"; exit 1; fi
          fi

          echo "SIM_HUB_MARK=$(grep -c 'data-sim-hub="light-first"' /tmp/sim.html)"
          echo "SIM_HUB_TITLE=$(grep -c 'Sim Hub' /tmp/sim.html)"
          echo "HUB_LINKS=$(grep -oE '/sim/match|/sim/stage|/sim/wallet|/sim/commerce|/sim/profile' /tmp/sim.html | sort -u | wc -l)"
          echo "HUB_CARDS=$(grep -c 'hub-card sim-card spr-pop' /tmp/sim.html)"
          echo "DONE=K7HUB_PROBE_OK"
