name: Verify CF
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe CF K9 navbar
        run: |
          ROOT="https://topcashback.shopergo.workers.dev"
          CB="${GITHUB_RUN_ID}-$(date +%s)"
          echo "CB=$CB"

          echo "== non-sim: Default Layout ada, navbar TIDAK ada =="
          RB=$(curl -4 -sL -o /tmp/root.html -w '%{http_code}' "$ROOT/?cb=$CB"); echo "ROOT=$RB"
          ROOT_DL=$(grep -c 'Default Layout' /tmp/root.html || true); echo "ROOT_DEFAULT_LAYOUT=$ROOT_DL"
          ROOT_NAV=$(grep -c 'data-sim-nav="1"' /tmp/root.html || true); echo "ROOT_NAV=$ROOT_NAV"
          if [ "$ROOT_DL" -lt 1 ]; then echo "NON_SIM_LAYOUT=BROKEN"; exit 1; fi
          if [ "$ROOT_NAV" -ne 0 ]; then echo "NAV_LEAKED_TO_NONSIM"; exit 1; fi

          echo "== semua route sim: 200 + clean + navbar ada + Default Layout NOL =="
          FAIL=0
          for U in "/sim" "/sim/match" "/sim/stage" "/sim/wallet" "/sim/commerce" "/sim/profile"; do
            C=$(curl -4 -sL -o /tmp/r.html -w '%{http_code}' "$ROOT$U?cb=$CB")
            DL=$(grep -c 'Default Layout' /tmp/r.html || true)
            SL=$(grep -c 'data-sim-layout="clean"' /tmp/r.html || true)
            NV=$(grep -c 'data-sim-nav="1"' /tmp/r.html || true)
            echo "ROUTE=$U CODE=$C DEFAULT_LAYOUT=$DL SIM_LAYOUT=$SL NAV=$NV"
            if [ "$C" != "200" ]; then FAIL=1; fi
            if [ "$DL" -ne 0 ]; then FAIL=1; fi
            if [ "$SL" -lt 1 ]; then FAIL=1; fi
            if [ "$NV" -lt 1 ]; then FAIL=1; fi
          done

          echo "== gate K7HUB dijaga: /sim hub tetap 5 link =="
          S=$(curl -4 -sL -o /tmp/sim.html -w '%{http_code}' "$ROOT/sim?cb=$CB"); echo "ROUTE_sim=$S"
          echo "SIM_HUB_MARK=$(grep -c 'data-sim-hub="light-first"' /tmp/sim.html || true)"
          echo "HUB_LINKS=$(grep -oE '/sim/match|/sim/stage|/sim/wallet|/sim/commerce|/sim/profile' /tmp/sim.html | sort -u | wc -l || true)"

          if [ "$FAIL" -ne 0 ]; then echo "K9_GATE=FAIL"; exit 1; fi
          echo "K9_GATE=OK"
          echo "DONE=K9_PROBE_OK"
